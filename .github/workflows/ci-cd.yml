name: SwiftLinkAI CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  AWS_REGION: ap-south-1

jobs:
  backend:
    name: Backend – Build & Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: swiftlinkai_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & run tests
        working-directory: backend
        run: mvn clean verify --batch-mode
        env:
          DB_URL: jdbc:mysql://localhost:3306/swiftlinkai_test?useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: test
          DB_PASSWORD: test
          REDIS_HOST: localhost
          OPENAI_API_KEY: sk-placeholder
          JWT_SECRET: c3dpZnRsaW5rYWlzdXBlcnNlY3JldGtleWZvcmp3dHRva2VucHJvZHVjdGlvbg==

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend – Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build & Push
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/swiftlinkai-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/swiftlinkai-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EKS
    needs: [docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name swiftlinkai-prod --region ${{ env.AWS_REGION }}

      - name: Deploy manifests
        run: |
          ECR_REGISTRY=$(aws ecr describe-registry --query registryId --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          sed -i "s|\${ECR_REGISTRY}|$ECR_REGISTRY|g; s|\${IMAGE_TAG}|${{ github.sha }}|g" \
            k8s/base/backend-deployment.yaml k8s/base/services.yaml
          kubectl apply -f k8s/base/ --namespace swiftlinkai
          kubectl rollout status deployment/swiftlinkai-backend -n swiftlinkai --timeout=300s
          kubectl rollout status deployment/swiftlinkai-frontend -n swiftlinkai --timeout=300s
