spring:
  application:
    name: swiftlinkai

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/swiftlinkai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:swiftlink}
    password: ${DB_PASSWORD:swiftlink123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  # ai:
    # enabled: true
    # fallback-enabled: true
    # timeout-seconds: 10
    # gemini:
    #   api-key: "AIzaSyD_x21Rtniyn0ETmHNPMlQaDU_f07G5lho"
    #   model: "gemini-1.5-flash"
    # openai:
    #   api-key: ${OPENAI_API_KEY:sk-placeholder}
    #   chat:
    #     options:
    #       model: gpt-4o-mini
    #       temperature: 0.3
    #       max-tokens: 512

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,readiness,liveness
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  base-url: ${APP_BASE_URL:http://localhost:8080/api/v1}
#  base-url: ${APP_BASE_URL:https://swiftlink.ai}
  jwt:
    secret: ${JWT_SECRET:c3dpZnRsaW5rYWlzdXBlcnNlY3JldGtleWZvcmp3dHRva2VucHJvZHVjdGlvbg==}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days
  rate-limit:
    shorten-per-minute: 100
    redirect-per-minute: 1000
  cache:
    redirect-ttl-hours: 24
    analytics-ttl-minutes: 15
  ai:
    gemini:
      api-key: "AIzaSyD_x21Rtniyn0ETmHNPMlQaDU_f07G5lho"
      model: "gemini-2.5-flash"
    enabled: true
    fallback-enabled: true
    timeout-seconds: 10

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 10s
  retry:
    instances:
      aiService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      aiService:
        timeoutDuration: 10s

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","traceId":"%X{traceId}","tenantId":"%X{tenantId}","service":"swiftlinkai","message":"%msg"}%n'
  level:
    com.swiftlinkai: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
