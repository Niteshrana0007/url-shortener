version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: swiftlinkai-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: swiftlink123  # Matches backend password
      MYSQL_DATABASE: swiftlinkai          # Matches backend database name
    # Optional: ensure data persists if the container restarts
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "swiftlink", "--password=swiftlink123"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swiftlinkai-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swiftlinkai-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/swiftlinkai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: swiftlink123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      JWT_SECRET: ${JWT_SECRET:-c3dpZnRsaW5rYWlzdXBlcnNlY3JldGtleWZvcmp3dHRva2VucHJvZHVjdGlvbg==}
      APP_BASE_URL: http://localhost:8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftlinkai-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql-data:
