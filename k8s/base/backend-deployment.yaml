---
apiVersion: v1
kind: Namespace
metadata:
  name: swiftlinkai
  labels:
    app.kubernetes.io/name: swiftlinkai

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftlinkai-backend
  namespace: swiftlinkai
  labels:
    app: swiftlinkai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiftlinkai-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: swiftlinkai-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: swiftlinkai-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ${ECR_REGISTRY}/swiftlinkai-backend:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: swiftlinkai-secrets
                  key: db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: swiftlinkai-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swiftlinkai-secrets
                  key: db-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: swiftlinkai-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: swiftlinkai-config
                  key: redis-port
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swiftlinkai-secrets
                  key: openai-api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: swiftlinkai-secrets
                  key: jwt-secret
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: swiftlinkai-config
                  key: app-base-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
